<html th:lang="${#locale.language}">
  <head>
    <style>
      /* page */
      @page {
        size: A4 portrait;
        margin: 0.7cm 1cm;
      }

      /* reset */
      * {
        position: relative;
        margin: 0;
        padding: 0;
        border: 0;
        border-collapse: collapse;
        border-spacing: 0;
      }

      /* font */
      .google-11 { font-family: "Google Sans"; font-size: 11pt; line-height: 1.2; }
      .google-12 { font-family: "Google Sans"; font-size: 12pt; line-height: 1.2; }
      .google-14 { font-family: "Google Sans"; font-size: 14pt; line-height: 1.2; }
      .times-11 { font-family: "Times New Roman"; font-size: 11pt; }
      .times-12 { font-family: "Times New Roman"; font-size: 12pt; }

      /* position */
      .left    { text-align: left; }
      .right   { text-align: right; }
      .center  { text-align: center; }
      .justify { text-align: justify; }

      /* typography */
      .normal   { font-weight: 400; }
      .semibold { font-weight: 600; }
      .uppercase  { text-transform: uppercase; }
      .capitalize { text-transform: capitalize; }

      .hyperlink {
        text-decoration: none;
        color: #2e57ce;
      }

      /* table */
      table {
        width: 100%;
      }

      /* list */
      ul {
        padding-left: 0.3cm;
        list-style: none;
      }

      li {
        padding-left: 0.4cm;
      }

      li::before {
        content: "•";
        position: absolute;
        left: 0;
      }
    </style>
  </head>
  <body>
    <header>
      <section>
        <h1 class="google-14 semibold uppercase left" th:text="${resume.name}"></h1>
        <h1 class="google-14 semibold uppercase right" th:text="${resume.role}"></h1>
      </section>

      <section>
        <h3 class="times-12 normal hyperlink left"><a th:href="${resume.linkedin}">LinkedIn</a></h3>
        <h3 class="times-12 normal hyperlink right"><a th:href="${'mailto:' + resume.email}" th:text="${resume.email}"></a></h3>
      </section>

      <section>
        <h3 class="times-12 normal hyperlink left"><a th:href="${resume.github}">GitHub</a></h3>
        <h3 class="times-12 normal right" th:text="${resume.phone}"></h3>
      </section>
    </header>

    <br />

    <th:block th:if="${not #lists.isEmpty(resume.experiences)}">
      <h2 class="google-12 semibold uppercase center" th:text="#{section.experience}"></h2>

      <section th:each="experience : ${resume.sortedExperiences}">
        <header>
          <th:block th:fragment="company-name(company)">
            <a th:if="${company != null && company.website != null}" class="hyperlink" th:href="${company.website}" th:text="${company.name}"></a>
            <span th:if="${company != null && company.website == null}" th:text="${company.name}"></span>
          </th:block>

          <h3 class="times-12 normal left">
            <th:block th:replace="~{:: company-name(${experience.company})}"></th:block>
            <span th:if="${experience.client != null}"> - </span>
            <th:block th:replace="~{:: company-name(${experience.client})}"></th:block>
            <span> | </span>
            <span class="semibold" th:text="${experience.role}"></span>
          </h3>

          <h3 class="times-12 semibold right">
            <th:block th:text="${experience.formattedFrom}"></th:block>
            <th:block> - </th:block>
            <span class="capitalize" th:text="${experience.formattedTo ?: #messages.msg('role.current')}"></span>
          </h3>
        </header>

        <p class="times-11 justify" th:text="${experience.formattedDescription}"></p>

        <ul>
          <li class="times-11 justify" th:each="task : ${experience.formattedTasks}" th:text="${task}"></li>
        </ul>

        <p class="times-11 justify" th:if="${not #strings.isEmpty(experience.collectedStack)}">
          <span class="semibold">Stack: </span>
          <th:block th:text="${experience.collectedStack + '.'}"></th:block>
        </p>

        <br />
      </section>
    </th:block>

    <th:block th:if="${not #lists.isEmpty(resume.degrees)}">
      <h2 class="google-12 semibold uppercase center" th:text="#{section.education}"></h2>

      <section th:each="degree : ${resume.sortedDegrees}">
        <h3 class="google-11 semibold left">
          <th:block th:text="${degree.degree}"></th:block>
          <span class="normal" th:text="${'(' + degree.institution + ')'}"></span>
        </h3>

        <h3 class="google-11 semibold right">
          <th:block th:text="${degree.from}"></th:block>
          <th:block> - </th:block>
          <span class="capitalize" th:text="${degree.to ?: #messages.msg('degree.ongoing')}"></span>
        </h3>
      </section>

      <br />
    </th:block>

    <th:block th:if="${not #lists.isEmpty(resume.certifications)}">
      <h2 class="google-12 semibold uppercase center" th:text="#{section.certification}"></h2>

      <section th:each="certification : ${resume.sortedCertifications}">
        <h3 class="google-11 semibold left">
          <th:block th:text="${certification.certification}"></th:block>
          <span class="normal" th:text="${'(' + certification.institution + ')'}"></span>
        </h3>

        <h3 class="google-11 semibold right" th:text="${certification.year}"></h3>
      </section>
    </th:block>
  </body>
</html>
